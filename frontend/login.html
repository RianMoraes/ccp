<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CCP Industrial</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 space-y-6 bg-white border border-slate-200 rounded-2xl shadow-sm">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">CCP</h1>
            <p class="text-sm text-slate-500 font-medium">Faça login para gerenciar o andamento industrial</p>
        </div>
        
        <form id="form-login" class="space-y-4">
            <div class="space-y-1">
                <label for="email" class="text-xs font-bold text-slate-700 uppercase">E-mail</label>
                <input id="email" type="email" required placeholder="admin@ccp.com.br" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600">
            </div>
            
            <div class="space-y-1">
                <label for="password" class="text-xs font-bold text-slate-700 uppercase">Senha</label>
                <input id="password" type="password" required placeholder="••••••••" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600">
            </div>
            
            <div id="error-message" class="hidden text-xs text-red-600 font-semibold p-3 bg-red-50 border border-red-200 rounded-lg">
                <!-- Inserido dinamicamente -->
            </div>
            
            <button type="submit" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow-sm transition-colors text-sm">
                Entrar no Sistema
            </button>
        </form>
    </div>

    <script type="module">
        import { API } from "./js/api.js";
        
        document.getElementById("form-login").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorDiv = document.getElementById("error-message");
            
            errorDiv.classList.add("hidden");
            
            try {
                await API.login(email, password);
                window.location.href = "index.html";
            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
